<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F2E4D6;overflow:hidden}
  #root{position:relative;width:100vw;height:100vh;font-family:"Montserrat","DejaVu Sans",sans-serif;color:#9E3D5E}
  .w{position:absolute;left:8vw;font-weight:800;line-height:1;white-space:nowrap}
  .ring{position:absolute;border-radius:50%;border:6px solid #C9577D}
</style></head>
<body><div id="root">
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div class="w" id="a" style="top:30vh;font-size:12vw">NÜMUNƏ</div>
  <div class="w" id="b" style="top:46vh;font-size:7vw;font-weight:600">hər səhnə sıfırdan yazılır</div>
</div>
<script>
// Nümunə (sxem, təkrar istifadə üçün şablon deyil): yazı t-yə görə daxil olur, halqalar genişlənir.
const ease = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
window.setTime = (t) => {
  const W = innerWidth, H = innerHeight;
  const a = document.getElementById('a'), b = document.getElementById('b');
  a.style.transform = `translateX(${(1 - ease(t / 0.7)) * -W * 0.6}px)`; a.style.opacity = ease(t / 0.5);
  b.style.transform = `translateY(${(1 - ease((t - 0.4) / 0.6)) * H * 0.05}px)`; b.style.opacity = ease((t - 0.4) / 0.6);
  [['r1', 0], ['r2', 0.5]].forEach(([id, d]) => {
    const r = document.getElementById(id), k = ((t - d) % 2) / 2, s = (0.15 + 0.85 * ease(k)) * W * 0.9;
    r.style.width = r.style.height = s + 'px'; r.style.left = (W * 0.75 - s / 2) + 'px'; r.style.top = (H * 0.72 - s / 2) + 'px'; r.style.opacity = 1 - k;
  });
};
</script></body></html>
