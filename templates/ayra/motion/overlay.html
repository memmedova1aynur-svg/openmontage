<!doctype html>
<!-- Şablon: {{...}} açarlarını doldur (render.py məntiqi), zamanlar timeline-dadır, caps.json = [[[söz,başla,bit],...],...] --><html lang="az"><head><meta charset="utf-8"><link rel="stylesheet" href="/home/user/openmontage/templates/ayra/_base.css">
<script src="/root/design-tools/node_modules/gsap/dist/gsap.min.js"></script><style>
html,body{background:transparent}
.card{left:72px;top:150px;width:936px;padding:46px 56px 52px;background:#FFF4F3;border-radius:30px;box-shadow:0 18px 50px rgba(120,20,40,.18)}
.kick{font-weight:600;font-size:26px;letter-spacing:.24em;color:#DC5063;text-transform:uppercase;display:flex;gap:16px;align-items:center}
.kick i{display:block;width:48px;height:3px;background:#DC5063}
.ttl{margin-top:18px;font-weight:600;font-size:76px;line-height:1.02;letter-spacing:-.025em;color:#AF2240}
.ttl em{font-style:italic;font-weight:300;color:#DC5063}
.mask{overflow:hidden;display:block}.mask>span{display:block}
.fakt{left:72px;top:150px;width:936px;padding:40px 56px 48px;background:#AF2240;border-radius:30px}
.pill{display:inline-block;font-weight:700;font-size:30px;letter-spacing:.2em;color:#AF2240;background:#FFB4B4;padding:10px 24px 8px;border-radius:40px}
.ft{margin-top:22px;font-weight:600;font-size:56px;line-height:1.06;letter-spacing:-.02em;color:#FFF4F3}
.ft b{font-weight:600;color:#FFB4B4}
.cap{left:80px;width:920px;top:1395px;text-align:center;white-space:nowrap}
.cap span.w{display:inline-block;font-weight:700;font-size:54px;letter-spacing:-.01em;color:#fff;padding:2px 12px 4px;margin:0 2px;border-radius:14px;
  text-shadow:0 3px 14px rgba(60,10,20,.55)}
.cap span.on{background:#FFB4B4;color:#AF2240;text-shadow:none}
.lt{left:72px;top:1380px;display:flex;align-items:stretch;background:#FFF4F3;border-radius:22px;overflow:hidden}
.lt i{width:16px;background:#DC5063}.lt div{padding:24px 40px 26px 30px}
.lt b{display:block;font-weight:600;font-size:50px;color:#AF2240;letter-spacing:-.01em}
.lt span{display:block;font-size:26px;color:#AF2240;margin-top:2px}
</style></head><body>
<div class="abs card" id="card"><div class="kick"><i></i>{{kicker}}</div>
 <div class="ttl">{{title_lines}}</div></div>
<div class="abs fakt" id="fakt"><span class="pill">{{pill}}</span>
 <div class="ft">{{fact_lines}}</div></div>
<div class="abs cap" id="cap"></div>
<div class="abs lt" id="lt"><i></i><div><b>{{name}}</b><span>{{role}}</span></div></div>
<script>
const E='expo.out', tl=gsap.timeline({paused:true});
gsap.set(['#card','#fakt','#lt'],{autoAlpha:0});
// başlıq kartı 0.1–7.9
tl.fromTo('#card',{autoAlpha:0,y:-40},{autoAlpha:1,y:0,duration:.6,ease:E},0.1)
  .from('#card .kick',{autoAlpha:0,x:-30,duration:.5,ease:E},0.35)
  .from('#card .mask>span',{yPercent:110,duration:.7,ease:E,stagger:.12},0.4)
  .to('#card',{autoAlpha:0,y:-30,duration:.4,ease:'power2.in'},7.7)
// FAKT kartı 8.3–14.6
  .fromTo('#fakt',{autoAlpha:0,y:-40},{autoAlpha:1,y:0,duration:.6,ease:E},8.3)
  .from('#fakt .pill',{scale:.6,autoAlpha:0,duration:.45,ease:'back.out(2)'},8.45)
  .from('#fakt .mask>span',{yPercent:110,duration:.7,ease:E,stagger:.14},8.6)
  .fromTo('#fakt b',{color:'#FFF4F3'},{color:'#FFB4B4',duration:.3},13.15)
// ad lövhəsi 13.95–15
  .fromTo('#lt',{autoAlpha:0,x:-40},{autoAlpha:1,x:0,duration:.55,ease:E},13.95)
  .from('#lt i',{scaleY:0,transformOrigin:'top',duration:.5,ease:E},14.0);
fetch('caps.json').then(r=>r.json()).then(G=>{window.G=G;window.ready=true});
window.seek=t=>{ tl.seek(t,false);
  const cap=document.getElementById('cap'); let h='';
  if(t<13.9){ const g=G.find(g=>t>=g[0][1]-0.08 && t<g[g.length-1][2]+0.25);
    if(g) h=g.map(w=>`<span class="w ${t>=w[1]&&t<w[2]+0.06?'on':''}">${w[0]}</span>`).join(''); }
  cap.innerHTML=h; };
</script></body></html>
