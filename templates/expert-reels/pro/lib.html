<script>
const C=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const eo=x=>{x=C(x);return 1-Math.pow(1-x,3)};const eio=x=>{x=C(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

// ---------- ÜSTDƏKİ YAZILAR (danışan görünür) ----------
function lower(t,D,p){const a=fade(t,D,0.3);const fs=p.fs||64;const lines=p.text.split('\n');let h='';
 lines.forEach((ln,i)=>{const r=rv(t,(p.lineAt?p.lineAt[i]||0:0)+0.04+i*0.09,0.34);h+=`<div style="${rise(r,22)}">${ln}${(p.dot&&i==lines.length-1)?` <span style="display:inline-block;width:${fs*.38}px;height:${fs*.38}px;border-radius:50%;background:var(--acc);transform:scale(${back(rv(t,p.dotAt||0.8,0.35))});vertical-align:middle"></span>`:''}</div>`});

const FULL={
 kinetic(t,D,p){const fs=p.fs||150;let h='';p.lines.forEach((ln,i)=>{const r=rv(t,p.ts?p.ts[i]:0.05+i*0.14,0.36);h+=`<div style="${rise(r,40)};color:${i==(p.hl??-1)?'var(--acc)':'var(--txt)'}">${ln}</div>`});

  let h='';const rows=9;

  const g=eio(C(t/D));const r=back(C(t/0.45));
  h+=`<div class="abs" style="left:50%;top:960px;transform:translate(-50%,-50%) scale(${(0.55+0.45*r)*(1+0.12*g)});font-weight:900;font-size:190px;letter-spacing:-7px;color:var(--ink);background:var(--acc);padding:0 40px;border-radius:28px;white-space:nowrap;box-shadow:0 30px 80px rgba(0,0,0,.45)">${p.word}</div>`;
  return `<div class="gbg"></div>${h}`},
 forget(t,D,p){let h='<div class="gbg"></div>';p.words.forEach((w,wi)=>{let s='';[...w].forEach((ch,ci)=>{const t0=(p.start||0.5)+wi*0.18+((ci*7+wi*3)%w.length)*0.08;const k=eo((t-t0)/0.5);s+=`<span style="display:inline-block;opacity:${1-k*.95};filter:blur(${16*k}px);transform:translateY(${-24*k}px)">${ch}</span>`});
  h+=`<div class="abs" style="left:84px;top:${560+wi*240}px;opacity:${rv(t,wi*.08,.3)};color:${wi==1?'var(--acc)':'var(--txt)'};font-weight:900;font-size:${p.fs||140}px;letter-spacing:-3px;white-space:nowrap">${s}</div>`});
  if(p.cap)h+=`<div class="abs" style="left:88px;top:1380px;${rise(rv(t,(p.start||0.5)+0.6,.4))};color:var(--muted);font-weight:700;font-size:52px">${p.cap}</div>`;return h},
 page(t,D,p){let h=`<div class="pbg"></div><div class="abs" style="inset:0;opacity:.32;filter:blur(3px);background:repeating-linear-gradient(180deg,transparent 0 58px,rgba(0,0,0,.08) 58px 60px)"></div>
  <div class="abs" style="left:80px;top:170px;width:920px;opacity:.16;filter:blur(5px);font-family:Lora;font-style:italic;font-size:42px;line-height:58px;color:#3B4A40">Oxuduğumuz hər səhifə yaddaşda iz buraxır. Yaddaş xatırlamaqla güclənir, təkrar və fasilə ilə möhkəmlənir…</div>`;
  if(p.icon)h+=`<div class="abs" style="left:84px;top:${(p.y||700)-190}px;${pop(rv(t,0.02,.4))}">${ico(p.icon,120,'var(--ink)',1.8)}</div>`;
  let y=p.y||700;const fs=p.fs||112;p.lines.forEach((ln,i)=>{const r=rv(t,p.ts[i],.34);h+=`<div class="abs" style="left:84px;top:${y}px;${rise(r)};color:var(--ink);font-weight:800;font-size:${fs}px;line-height:1.02;letter-spacing:-3px;white-space:nowrap">${ln}</div>`;
   if(p.marks&&p.marks.includes(i))h+=`<div class="abs" style="left:76px;top:${y+fs*0.52}px;height:${fs*0.42}px;border-radius:8px;background:var(--acc);opacity:.55;width:${(p.markW||520)*rv(t,p.ts[i]+0.22,0.35)}px;z-index:-1"></div>`;y+=fs*1.22});
  (p.sub||[]).forEach((sb,i)=>{h+=`<div class="abs" style="left:88px;top:${y+40+i*80}px;${rise(rv(t,p.subTs[i],.35),14)};color:var(--muted);font-weight:700;font-size:52px">${sb}</div>`});return h},
 contrast(t,D,p){let e='';for(let i=0;i<9;i++)e+=`<div class="abs" style="left:${-60+(i%2)*120}px;top:${120+i*200}px;opacity:${.08*rv(t,i*.05,.4)};color:var(--txt);font-weight:900;font-size:220px;letter-spacing:-4px;white-space:nowrap;transform:translateX(${-40*t}px)">${p.bg} ${p.bg}</div>`;
  let h='';p.lines.forEach((ln,i)=>{h+=`<div style="${rise(rv(t,p.ts[i],.34),30)}">${ln}</div>`});

 transform(t,D,p){const a=rv(t,0.05,.35);const u=eio(C((t-p.u)/0.6));const sk=p.strike!=null?eo(C((t-p.strike)/0.35)):0;const fw=String(p.from).split(/(<br>| )/).filter(x=>x.trim()&&x!=' ');

 cols(t,D,p){let h='<div class="gbg"></div>';if(p.title)h+=`<div class="abs" style="left:84px;top:420px;${rise(rv(t,.02,.35))};color:var(--txt);font-weight:800;font-size:84px;line-height:1.04">${p.title}</div>`;

   const q=(a,b)=>`background:${a}`;const bw=`<div class="abs" style="left:0;top:0;width:540px;height:470px;background:${V('#F2F2F2','#111',56)}"></div><div class="abs" style="left:540px;top:0;width:540px;height:470px;background:${Hh('#F2F2F2','#111',56)}"></div><div class="abs" style="left:0;top:470px;width:540px;height:470px;background:${Hh('#F2F2F2','#111',56)}"></div><div class="abs" style="left:540px;top:470px;width:540px;height:470px;background:${V('#F2F2F2','#111',56)}"></div>`;
