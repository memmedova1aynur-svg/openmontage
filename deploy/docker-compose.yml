# İstifadə: deploy/.env faylında MONTAJ_DOMAIN, MONTAJ_PASSWORD (və istəyə görə ANTHROPIC_API_KEY) yazın,
# sonra: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  montaj:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MONTAJ_PASSWORD: ${MONTAJ_PASSWORD:?MONTAJ_PASSWORD təyin edilməyib}
      MONTAJ_SECRET: ${MONTAJ_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONTAJ_WHISPER_MODEL: ${MONTAJ_WHISPER_MODEL:-small}
      MONTAJ_MAX_JOBS: ${MONTAJ_MAX_JOBS:-1}
    volumes:
      - montaj-data:/data
    expose:
      - "4760"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MONTAJ_DOMAIN: ${MONTAJ_DOMAIN:?MONTAJ_DOMAIN təyin edilməyib}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - montaj

volumes:
  montaj-data:
  caddy-data:
  caddy-config:
