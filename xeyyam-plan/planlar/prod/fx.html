<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Neyron şəbəkəsi: iki yan klaster, psevdo-3D (perspektiv + dərinlik), əlaqələr tədricən qurulur.
// draw(t, level, alpha): t — saniyə (hərəkət), level 0..1 — şəbəkənin qurulma dərəcəsi, alpha — ümumi görünmə.
const cv=document.getElementById('c'),g=cv.getContext('2d');
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const F=900;
function cluster(seed,cx,cy,n,dir){
  const r=rng(seed),nodes=[];
  for(let i=0;i<n;i++){
    // y boyunca bərabər paylanma + təsadüfi sürüşmə
    const y=-300+600*(i+0.5)/n+(r()-0.5)*60;
    nodes.push({x:(r()-0.5)*230,y,z:(r()-0.5)*320,r:21+r()*13,ph:r()*6.28,th:0});
  }
  // qonşular arası əlaqələr
  const edges=[];
  for(let i=0;i<n;i++){
    const d=nodes.map((m,j)=>[Math.hypot(m.x-nodes[i].x,m.y-nodes[i].y,m.z-nodes[i].z),j]).filter(e=>e[1]!==i).sort((a,b)=>a[0]-b[0]);
    for(const [,j] of d.slice(0,2)){const k=i<j?i+'-'+j:j+'-'+i;if(!edges.find(e=>e.k===k))edges.push({k,a:i,b:j,bend:(r()-0.5)*90,sp:0.5+r()*0.6,off:r()})}
  }
  // qurulma sırası: yuxarıdan aşağı dalğa
  const order=nodes.map((m,i)=>i).sort((a,b)=>nodes[a].y-nodes[b].y);
  order.forEach((i,k)=>nodes[i].th=0.02+0.5*k/n);
  edges.forEach((e,k)=>e.th=Math.max(nodes[e.a].th,nodes[e.b].th)+0.06+0.36*(k/edges.length));
  // kiçik dendrit budaqları
  nodes.forEach(m=>{m.br=[];const c=3+Math.floor(r()*3);for(let q=0;q<c;q++)m.br.push({an:r()*6.28,len:36+r()*40,bend:(r()-0.5)*1.2})});
  return {cx,cy,nodes,edges,dir};
}
const CL=[cluster(23,925,610,11,-1)];
// "86 milyard" partlayışı üçün kiçik nöqtələr
const SR=rng(99),STARS=[];for(let i=0;i<260;i++){const side=i%2?1:-1;STARS.push({x:540+side*(300+SR()*230),y:260+SR()*880,z:SR(),th:SR(),ph:SR()*6.28})}
function proj(c,m,t){
  const a=Math.sin(t*0.45+c.dir)*0.32*c.dir, ca=Math.cos(a), sa=Math.sin(a);
  const bob=Math.sin(t*0.9+m.ph)*7;
  const x=m.x*ca-m.z*sa, z=m.x*sa+m.z*ca, s=F/(F+z);
  return {x:c.cx+x*s, y:c.cy+(m.y+bob)*s, s, z};
}
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function soma(p,rad,al){
  const R=rad*p.s, dep=0.55+0.45*Math.min(1,Math.max(0,(200-p.z)/400));
  let gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R*3.2);
  gr.addColorStop(0,`rgba(108,197,126,${0.34*al*dep})`);gr.addColorStop(1,'rgba(108,197,126,0)');
  g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,R*3.2,0,6.28);g.fill();
  gr=g.createRadialGradient(p.x-R*0.35,p.y-R*0.4,R*0.08,p.x,p.y,R);
  gr.addColorStop(0,`rgba(255,255,255,${al})`);gr.addColorStop(0.35,`rgba(181,233,207,${al*dep})`);
  gr.addColorStop(0.8,`rgba(62,158,87,${al*dep})`);gr.addColorStop(1,`rgba(20,84,52,${al*dep*0.9})`);
  g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,R,0,6.28);g.fill();
}
function qpt(a,c,b,u){const v=1-u;return {x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y}}
function neurons(t,level,burst){
  g.lineCap='round';
  if(burst>0){for(const s of STARS){const a=ease((burst-s.th*0.7)/0.3);if(a<=0)continue;
    const tw=0.6+0.4*Math.sin(t*5+s.ph), R=(1.6+s.z*3.2)*a;
    g.fillStyle=`rgba(${s.z>0.6?255:181},${s.z>0.6?255:233},${s.z>0.6?255:207},${(0.35+0.6*s.z)*a*tw})`;
    g.beginPath();g.arc(s.x,s.y+Math.sin(t*0.8+s.ph)*5,R,0,6.28);g.fill()}}
  for(const c of CL){
    const P=c.nodes.map(m=>proj(c,m,t));
    // əlaqələr
    for(const e of c.edges){
      const pr=ease((level-e.th)/0.14);if(pr<=0)continue;
      const A=P[e.a],B=P[e.b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
      const C={x:mx-dy/L*e.bend,y:my+dx/L*e.bend},sc=(A.s+B.s)/2;
      g.beginPath();g.moveTo(A.x,A.y);
      const N=22;for(let i=1;i<=N*pr;i++){const q=qpt(A,C,B,i/N);g.lineTo(q.x,q.y)}
      g.strokeStyle=`rgba(108,197,126,${0.22})`;g.lineWidth=13*sc;g.stroke();
      g.strokeStyle=`rgba(210,245,224,${0.85})`;g.lineWidth=4*sc;g.stroke();
      if(pr<1){const q=qpt(A,C,B,pr);g.fillStyle='rgba(255,255,255,0.95)';g.beginPath();g.arc(q.x,q.y,5*sc,0,6.28);g.fill()}
      else{const u=((t*e.sp*0.55+e.off)%1),q=qpt(A,C,B,u);
        let gr=g.createRadialGradient(q.x,q.y,0,q.x,q.y,13*sc);gr.addColorStop(0,'rgba(255,255,255,0.95)');gr.addColorStop(1,'rgba(108,197,126,0)');
        g.fillStyle=gr;g.beginPath();g.arc(q.x,q.y,13*sc,0,6.28);g.fill()}
    }
    // neyronlar (uzaqdan yaxına)
    c.nodes.map((m,i)=>i).sort((a,b)=>P[b].z-P[a].z).forEach(i=>{
      const m=c.nodes[i],p=P[i],a=ease((level-m.th)/0.08);if(a<=0)return;
      g.strokeStyle=`rgba(150,220,175,${0.7*a})`;
      for(const b of m.br){const an=b.an+Math.sin(t*0.6+m.ph)*0.12,l=b.len*p.s*a;
        g.lineWidth=3.2*p.s;g.beginPath();g.moveTo(p.x,p.y);
        g.quadraticCurveTo(p.x+Math.cos(an+b.bend)*l*0.6,p.y+Math.sin(an+b.bend)*l*0.6,p.x+Math.cos(an)*l,p.y+Math.sin(an)*l);g.stroke()}
      soma(p,m.r*(0.6+0.4*a)*(1+0.06*Math.sin(t*2.2+m.ph)),a);
    });
  }
}
const THEMES={neurons};
/*THEMES*/
// Eyni anda çox iş: nişanlar 3D orbitdə fırlanır, sürət artır
function icon(k,x,y,s,al){g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=al;g.shadowColor='rgba(0,0,0,0.45)';g.shadowBlur=18;
  const gr=g.createRadialGradient(-14,-16,4,0,0,52);gr.addColorStop(0,'#1E6B4A');gr.addColorStop(1,'#0F3B2E');g.fillStyle=gr;g.beginPath();g.arc(0,0,50,0,6.28);g.fill();
  g.shadowColor='transparent';g.strokeStyle='#6CC57E';g.lineWidth=4;g.stroke();g.strokeStyle='#FFFFFF';g.fillStyle='#FFFFFF';g.lineWidth=5;g.lineJoin='round';g.lineCap='round';
  if(k===0){g.beginPath();g.moveTo(0,-18);g.quadraticCurveTo(-14,-26,-28,-20);g.lineTo(-28,18);g.quadraticCurveTo(-14,12,0,20);g.quadraticCurveTo(14,12,28,18);g.lineTo(28,-20);g.quadraticCurveTo(14,-26,0,-18);g.lineTo(0,20);g.stroke()}
  if(k===1){g.beginPath();g.roundRect(-15,-27,30,54,7);g.stroke();g.beginPath();g.arc(0,18,2.5,0,6.28);g.fill()}
  if(k===2){g.beginPath();g.roundRect(-24,-20,48,32,4);g.stroke();g.beginPath();g.moveTo(-32,20);g.lineTo(32,20);g.stroke()}
  if(k===3){g.beginPath();g.roundRect(-26,-22,52,36,10);g.stroke();g.beginPath();g.moveTo(-10,14);g.lineTo(-16,26);g.lineTo(2,14);g.stroke()}
  if(k===4){g.beginPath();g.arc(0,0,24,0,6.28);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(0,-15);g.moveTo(0,0);g.lineTo(11,6);g.stroke()}
  g.restore()}
THEMES.juggle=function(t,level,burst,o){
  const cx=o.x??890,cy=(o.y??540),rx=o.rx||130,ry=o.ry||210,n=o.n||5,a=ease(level/0.1),sp=(o.sp||1.2)*(1+level*(o.acc??2.2));
  const ang0=t*sp, items=[];for(let i=0;i<n;i++){const an=ang0+i/n*6.2832,z=Math.sin(an);items.push({k:i%5,x:cx+Math.cos(an)*rx,y:cy+Math.sin(an*1.0+0.6)*ry*0.5+Math.cos(an*2+i)*ry*0.28,z,sh:ease((level-i*0.07)/0.1)})}
  g.save();g.globalAlpha*=a;g.strokeStyle='rgba(181,233,207,0.28)';g.lineWidth=2;g.setLineDash([6,10]);g.beginPath();g.ellipse(cx,cy,rx,ry*0.6,0,0,6.28);g.stroke();g.setLineDash([]);g.restore();
  items.sort((p,q)=>p.z-q.z).forEach(it=>{if(it.sh>0)icon(it.k,it.x,it.y,(0.72+0.3*(it.z+1)/2)*it.sh,a*(0.55+0.45*(it.z+1)/2))});
};

// Musiqi notları: dalğalanan not xətləri üzərində süzən notlar
function note(x,y,s,al,beam){g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=al;g.shadowColor='rgba(108,197,126,0.8)';g.shadowBlur=16;
  const gr=g.createRadialGradient(-6,-5,2,0,0,18);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(1,'#8FD9A5');g.fillStyle=gr;g.strokeStyle='#FFFFFF';g.lineWidth=5;g.lineCap='round';
  g.save();g.rotate(-0.35);g.beginPath();g.ellipse(0,0,17,12,0,0,6.28);g.fill();g.restore();g.beginPath();g.moveTo(15,-4);g.lineTo(15,-62);g.stroke();
  if(beam){g.save();g.translate(46,10);g.rotate(-0.35);g.beginPath();g.ellipse(0,0,17,12,0,0,6.28);g.fill();g.restore();g.beginPath();g.moveTo(61,6);g.lineTo(61,-52);g.stroke();g.lineWidth=9;g.beginPath();g.moveTo(15,-62);g.lineTo(61,-52);g.stroke()}
  else{g.beginPath();g.moveTo(15,-62);g.quadraticCurveTo(40,-48,32,-24);g.stroke()}
  g.restore()}
THEMES.notes=function(t,level,burst,o){
  const x0=o.x??760,x1=o.x1??1075,cy=o.y??560,a=ease(level/0.08),amp=o.amp||26;
  g.save();g.globalAlpha*=a;
  for(let k=0;k<5;k++){g.beginPath();for(let x=x0;x<=x1;x+=8){const u=(x-x0)/(x1-x0),y=cy+(k-2)*26+Math.sin(u*5+t*1.4+k*0.25)*amp*u;x===x0?g.moveTo(x,y):g.lineTo(x,y)}
    const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'rgba(181,233,207,0)');gr.addColorStop(0.4,'rgba(181,233,207,0.75)');gr.addColorStop(1,'rgba(181,233,207,0.25)');g.strokeStyle=gr;g.lineWidth=2.5;g.stroke()}
  const r=rng(o.seed||3);for(let i=0;i<6;i++){const sp=0.11+r()*0.07,ph=r(),u=((t*sp+ph)%1),th=r()*0.5,b=ease((level-th)/0.08);if(b<=0)continue;
    const x=x0+30+(x1-x0-80)*(0.15+0.85*r()),y=cy+170-u*520,sc=(0.7+r()*0.6)*(0.9+0.2*Math.sin(t*2+i));
    note(x+Math.sin(u*6+i)*22,y,sc,Math.sin(u*3.14)*b,i%3===0)}
  g.restore();
};
// Qrafik: qısa müddətdə yüksəliş, uzun müddətdə qırıq xətt və "?"
THEMES.graph=function(t,level,burst,o){
  const x=o.x??700,y=(o.y??330)+Math.sin(t*1.1)*5,W_=350,H_=290,a=ease(level/0.06);g.save();g.globalAlpha*=a;
  g.shadowColor='rgba(0,0,0,0.4)';g.shadowBlur=28;g.shadowOffsetY=8;g.fillStyle='#0F3B2E';g.beginPath();g.roundRect(x,y,W_,H_,34);g.fill();g.shadowColor='transparent';
  const ox=x+40,oy=y+H_-56,gw=W_-80,gh=H_-120;g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=3;g.beginPath();g.moveTo(ox,oy-gh-8);g.lineTo(ox,oy);g.lineTo(ox+gw,oy);g.stroke();
  const p=ease((level-0.1)/0.3),q=ease((level-(o.longAt??0.55))/0.2),f=u=>oy-gh*(0.12+0.78*(1-Math.exp(-u*9)));
  g.strokeStyle='#6CC57E';g.lineWidth=7;g.lineCap='round';g.beginPath();for(let i=0;i<=30*p;i++){const u=i/30*0.42;const X=ox+gw*u,Y=f(u);i?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();
  if(p>0.9){g.fillStyle='#FFFFFF';g.beginPath();g.arc(ox+gw*0.42,f(0.42),9,0,6.28);g.fill()}
  if(q>0&&o.drop){g.strokeStyle='#FFFFFF';g.lineWidth=7;g.beginPath();g.moveTo(ox+gw*0.42,f(0.42));for(let i=1;i<=24*q;i++){const u=i/24;g.lineTo(ox+gw*(0.42+0.56*u),f(0.42)+(oy-f(0.42)-6)*Math.pow(u,1.6))}g.stroke();
    g.font='800 50px Montserrat, MontserratExt, Arial';g.fillStyle='#FFFFFF';g.textAlign='center';g.globalAlpha*=ease((q-0.6)/0.4);g.fillText('↓',ox+gw*0.86,f(0.42)+10)}
  else if(q>0){g.setLineDash([10,12]);g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=5;g.beginPath();g.moveTo(ox+gw*0.42,f(0.42));g.lineTo(ox+gw*(0.42+0.58*q),f(0.42)+10*q);g.stroke();g.setLineDash([]);
    g.font='800 54px Montserrat, MontserratExt, Arial';g.fillStyle='#FFFFFF';g.textAlign='center';g.globalAlpha*=ease((q-0.6)/0.4);g.fillText('?',ox+gw*0.9,f(0.42)-22)}
  g.restore();g.save();g.globalAlpha*=a;g.font='700 24px Montserrat, MontserratExt, Arial';g.fillStyle='#B5E9CF';g.textAlign='left';g.fillText(o.l1||'qısa müddət',ox,oy+34);
  if(q>0){g.textAlign='right';g.globalAlpha*=q;g.fillText(o.l2||'uzun müddət',ox+gw,oy+34)}g.restore();
};

// Yoxlama siyahısı: sətirlər bir-bir çıxır ("?"), solve anında yaşıl işarəyə çevrilir
THEMES.checklist=function(t,level,burst,o){
  const rows=o.rows||[],x=o.x??50,y=(o.y??210)+Math.sin(t*1.1)*5,W_=o.w||600,rh=74,H_=rows.length*rh+44,a=ease(level/0.03),sv=ease((level-(o.solve??2))/0.05);
  const shown=rows.filter(r=>level>=r[1]).length;const hh=44+Math.max(1,shown)*rh;
  g.save();g.globalAlpha*=a;g.shadowColor='rgba(0,0,0,0.32)';g.shadowBlur=28;g.shadowOffsetY=10;g.fillStyle='#0F3B2E';g.beginPath();g.roundRect(x,y,W_,hh,34);g.fill();g.restore();
  rows.forEach(([txt,th],i)=>{const b=ease((level-th)/0.025);if(b<=0)return;const ry=y+22+i*rh,cy=ry+rh/2;
    g.save();g.globalAlpha*=a*b;g.translate((1-b)*-30,0);
    g.fillStyle=sv>0.5?'#6CC57E':'rgba(255,255,255,0.16)';g.beginPath();g.arc(x+52,cy,24,0,6.28);g.fill();
    g.textAlign='center';g.font='800 30px Montserrat, MontserratExt, Arial';g.fillStyle=sv>0.5?'#0B2A20':'#FFFFFF';g.fillText(sv>0.5?'✓':'?',x+52,cy+11);
    g.textAlign='left';g.font='700 34px Montserrat, MontserratExt, Arial';g.fillStyle=`rgba(255,255,255,${1-0.45*sv})`;g.fillText(txt,x+94,cy+12);
    if(sv>0){const tw=g.measureText(txt).width;g.strokeStyle='#6CC57E';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(x+94,cy+2);g.lineTo(x+94+tw*ease((sv-i*0.1)/0.6),cy+2);g.stroke()}
    g.restore()});
};
// CTA paneli: başlıq + alt başlıq + pulsasiya edən düymə
THEMES.cta=function(t,level,burst,o){
  const x=o.x??50,y=(o.y??230)+Math.sin(t*1.1)*5,W_=o.w||640,a=ease(level/0.05),pb=ease((level-(o.btnAt??0.7))/0.06),H_=o.btn?280:170;
  g.save();g.globalAlpha*=a;g.translate(0,(1-a)*-24);g.shadowColor='rgba(0,0,0,0.35)';g.shadowBlur=30;g.shadowOffsetY=10;g.fillStyle='#0F3B2E';
  g.beginPath();g.roundRect(x,y,W_,170+(H_-170)*pb,38);g.fill();g.shadowColor='transparent';
  g.fillStyle='#6CC57E';g.beginPath();g.roundRect(x+36,y+34,8,102,4);g.fill();
  g.textAlign='left';g.fillStyle='#FFFFFF';g.font='800 50px Montserrat, MontserratExt, Arial';g.fillText(o.title||'',x+64,y+84);
  g.fillStyle='#B5E9CF';g.font='700 32px Montserrat, MontserratExt, Arial';g.fillText(o.sub||'',x+64,y+130);
  if(o.btn&&pb>0){const pu=1+0.035*Math.sin(t*5),bw=300,bh=74,bx=x+64+bw/2,by=y+208;g.globalAlpha*=pb;g.translate(bx,by);g.scale(pu,pu);
    g.shadowColor='rgba(108,197,126,0.7)';g.shadowBlur=22;g.fillStyle='#6CC57E';g.beginPath();g.roundRect(-bw/2,-bh/2,bw,bh,37);g.fill();g.shadowColor='transparent';
    g.fillStyle='#0B2A20';g.textAlign='center';g.font='800 36px Montserrat, MontserratExt, Arial';g.fillText(o.btn,0,13)}
  g.restore();
};

// Ay və ulduzlar + "Z z z"
THEMES.moon=function(t,level,burst,o){
  const cx=o.x??900,cy=(o.y??470)+Math.sin(t*0.9)*8,R=o.r||105,a=ease(level/0.1);
  g.save();g.globalAlpha*=a;
  let gr=g.createRadialGradient(cx,cy,R*0.5,cx,cy,R*2.3);gr.addColorStop(0,'rgba(181,233,207,0.30)');gr.addColorStop(1,'rgba(181,233,207,0)');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R*2.3,0,6.28);g.fill();
  // aypara (3D kölgə ilə)
  const oc=document.createElement('canvas');oc.width=oc.height=R*2+20;const c2=oc.getContext('2d');const m=R+10;
  gr=c2.createRadialGradient(m-R*0.35,m-R*0.35,R*0.1,m,m,R);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(0.6,'#DDF3E6');gr.addColorStop(1,'#8FD9A5');
  c2.fillStyle=gr;c2.beginPath();c2.arc(m,m,R,0,6.28);c2.fill();c2.globalCompositeOperation='destination-out';c2.beginPath();c2.arc(m+R*0.48,m-R*0.22,R*0.86,0,6.28);c2.fill();
  g.save();g.translate(cx,cy);g.rotate(-0.25+Math.sin(t*0.6)*0.04);g.shadowColor='rgba(181,233,207,0.8)';g.shadowBlur=30;g.drawImage(oc,-m,-m);g.restore();
  // ulduzlar
  const r=rng(41);for(let i=0;i<14;i++){const sx=cx-250+r()*420,sy=cy-250+r()*520,ss=5+r()*9,th=0.1+r()*0.6,ph=r()*6.28,b=ease((level-th)/0.08);
    if(b<=0||Math.hypot(sx-cx,sy-cy)<R*1.15)continue;const tw=0.55+0.45*Math.sin(t*3+ph),q=ss*b*(0.8+0.2*tw);
    g.fillStyle=`rgba(255,255,255,${0.9*tw})`;g.beginPath();g.moveTo(sx,sy-q);g.quadraticCurveTo(sx,sy,sx+q,sy);g.quadraticCurveTo(sx,sy,sx,sy+q);g.quadraticCurveTo(sx,sy,sx-q,sy);g.quadraticCurveTo(sx,sy,sx,sy-q);g.fill()}
  // Z z z
  g.font='800 60px Montserrat, MontserratExt, Arial';g.textAlign='center';
  for(let i=0;i<3;i++){const u=((t*0.35+i/3)%1),zx=cx-R*0.9-u*90+Math.sin(u*6+i)*14,zy=cy-R*0.2-u*230;g.fillStyle=`rgba(255,255,255,${Math.sin(u*3.14)*0.95})`;
    g.save();g.translate(zx,zy);g.scale(0.5+u*0.7,0.5+u*0.7);g.fillText('z',0,0);g.restore()}
  g.restore();
};
// Yuxu saatı: 23:00–06:00 qövsü dolur
THEMES.sleepclock=function(t,level,burst,o){
  const cx=o.x??895,cy=(o.y??500)+Math.sin(t*1.1)*6,R=o.r||125,a=ease(level/0.08);g.save();g.globalAlpha*=a;
  g.shadowColor='rgba(0,0,0,0.45)';g.shadowBlur=30;g.fillStyle='#0F3B2E';g.beginPath();g.arc(cx,cy,R+30,0,6.28);g.fill();g.shadowColor='transparent';
  g.strokeStyle='rgba(255,255,255,0.16)';g.lineWidth=20;g.beginPath();g.arc(cx,cy,R,0,6.28);g.stroke();
  const ang=h=>-1.5708+(h%12)/12*6.2832,a0=ang(11),span=7/12*6.2832,p=ease((level-0.1)/0.45);
  g.strokeStyle='#6CC57E';g.lineCap='round';g.beginPath();g.arc(cx,cy,R,a0,a0+span*Math.max(0.01,p));g.stroke();
  for(let h=0;h<12;h++){const an=ang(h),big=h%3===0;g.strokeStyle='rgba(255,255,255,0.75)';g.lineWidth=big?5:2.5;g.beginPath();g.moveTo(cx+Math.cos(an)*(R-22),cy+Math.sin(an)*(R-22));g.lineTo(cx+Math.cos(an)*(R-(big?42:34)),cy+Math.sin(an)*(R-(big?42:34)));g.stroke()}
  const hh=11+7*p,ha=ang(hh),ma=-1.5708+(hh%1)*6.2832;g.strokeStyle='#FFFFFF';g.lineWidth=8;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(ha)*R*0.48,cy+Math.sin(ha)*R*0.48);g.stroke();
  g.lineWidth=5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(ma)*R*0.68,cy+Math.sin(ma)*R*0.68);g.stroke();g.fillStyle='#6CC57E';g.beginPath();g.arc(cx,cy,9,0,6.28);g.fill();
  g.font='800 34px Montserrat, MontserratExt, Arial';g.textAlign='center';g.fillStyle='#FFFFFF';const e=(h,lab)=>{const an=ang(h);g.fillText(lab,cx+Math.cos(an)*(R+70),cy+Math.sin(an)*(R+70)+12)};
  if(p>0.02)e(11,'23:00');if(p>0.95)e(6,'06:00');g.restore();
};

// Telefon: ekranda qısa videolar sürüşür; opts.timer — üstündə geri sayım halqası və etiket
THEMES.phone=function(t,level,burst,o){
  const cx=o.x??905,cy=(o.y??560)+Math.sin(t*1.2)*8,s=o.s||1,w=190*s,h=370*s,a=ease(level/0.1),rot=Math.sin(t*0.8)*0.05-0.08;
  g.save();g.translate(cx,cy);g.rotate(rot);g.scale(0.7+0.3*a,0.7+0.3*a);g.globalAlpha*=a;
  g.shadowColor='rgba(0,0,0,0.45)';g.shadowBlur=30;g.shadowOffsetY=14;g.fillStyle='#082219';g.beginPath();g.roundRect(-w/2,-h/2,w,h,30*s);g.fill();
  g.shadowColor='transparent';g.strokeStyle='#6CC57E';g.lineWidth=5*s;g.stroke();
  g.save();g.beginPath();g.roundRect(-w/2+12*s,-h/2+14*s,w-24*s,h-28*s,20*s);g.clip();
  const ch=(h-28*s)*0.62,off=(t*(o.speed||150)*s)%ch;
  for(let i=-1;i<3;i++){const y=-h/2+14*s+i*ch-off+ch,k=((Math.floor(t*(o.speed||150)*s/ch)+i)%3+3)%3;
    g.fillStyle=['#1E6B4A','#B5E9CF','#3E9E57'][k];g.fillRect(-w/2+12*s,y+5*s,w-24*s,ch-10*s);
    g.fillStyle='rgba(255,255,255,0.92)';g.beginPath();const px=0,py=y+ch/2;g.moveTo(px-16*s,py-20*s);g.lineTo(px+20*s,py);g.lineTo(px-16*s,py+20*s);g.closePath();g.fill()}
  g.restore();g.fillStyle='#082219';g.beginPath();g.roundRect(-26*s,-h/2+8*s,52*s,12*s,6*s);g.fill();g.restore();
  if(o.timer){const R=62*s,tx=cx-w/2-30*s,ty=cy-h/2-10*s,b=ease((level-0.12)/0.1);if(b>0){g.save();g.globalAlpha*=b;
    g.shadowColor='rgba(0,0,0,0.4)';g.shadowBlur=20;g.fillStyle='#0F3B2E';g.beginPath();g.arc(tx,ty,R+14,0,6.28);g.fill();g.shadowColor='transparent';
    g.strokeStyle='rgba(255,255,255,0.2)';g.lineWidth=10;g.beginPath();g.arc(tx,ty,R,0,6.28);g.stroke();
    g.strokeStyle='#6CC57E';g.lineCap='round';g.beginPath();g.arc(tx,ty,R,-1.57,-1.57+6.28*Math.min(1,Math.max(0.02,(level-0.15)/0.8)));g.stroke();
    g.fillStyle='#FFFFFF';g.textAlign='center';g.font=`800 ${Math.round(40*s)}px Montserrat, MontserratExt, Arial`;g.fillText(o.timer,tx,ty+6);
    g.font=`700 ${Math.round(22*s)}px Montserrat, MontserratExt, Arial`;g.fillStyle='#B5E9CF';g.fillText(o.unit||'dəq',tx,ty+34);g.restore()}}
};
// Halqa: 45 dəq öyrənmə (yaşıl) + 15 dəq fasilə (ağ)
THEMES.ring=function(t,level,burst,o){
  const cx=o.x??900,cy=(o.y??520)+Math.sin(t*1.2)*6,R=o.r||120,a=ease(level/0.08);g.save();g.globalAlpha*=a;
  g.shadowColor='rgba(0,0,0,0.45)';g.shadowBlur=30;g.fillStyle='#0F3B2E';g.beginPath();g.arc(cx,cy,R+34,0,6.28);g.fill();g.shadowColor='transparent';
  g.lineWidth=26;g.strokeStyle='rgba(255,255,255,0.14)';g.beginPath();g.arc(cx,cy,R,0,6.28);g.stroke();
  const p1=ease((level-0.1)/0.38),p2=ease((level-0.52)/0.3);
  g.strokeStyle='#6CC57E';g.beginPath();g.arc(cx,cy,R,-1.57,-1.57+6.28*0.75*Math.max(0.004,p1));g.stroke();
  if(p2>0){g.strokeStyle='#FFFFFF';g.beginPath();g.arc(cx,cy,R,-1.57+6.28*0.75,-1.57+6.28*(0.75+0.25*p2));g.stroke()}
  g.textAlign='center';g.fillStyle=p2>0?'#FFFFFF':'#6CC57E';g.font='800 84px Montserrat, MontserratExt, Arial';g.fillText(p2>0?'15':'45',cx,cy+18);
  g.font='700 26px Montserrat, MontserratExt, Arial';g.fillStyle='#B5E9CF';g.fillText(p2>0?'fasilə':'öyrənmə',cx,cy+56);g.restore();
};

// Ağ ayı fikir balonu: ayı çıxır, "düşünmə" cəhdində kiçilir, sonra daha böyük qayıdır və çoxalır
function bearFace(cx,cy,R){
  g.fillStyle='#FFFFFF';for(const s of[-1,1]){g.beginPath();g.arc(cx+s*0.72*R,cy-0.72*R,0.34*R,0,6.28);g.fill()}
  g.fillStyle='#CFE6DA';for(const s of[-1,1]){g.beginPath();g.arc(cx+s*0.72*R,cy-0.72*R,0.17*R,0,6.28);g.fill()}
  const gr=g.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(1,'#DDEEE6');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R,0,6.28);g.fill();
  g.fillStyle='#EEF6F1';g.beginPath();g.ellipse(cx,cy+0.3*R,0.42*R,0.32*R,0,0,6.28);g.fill();
  g.fillStyle='#10241C';for(const s of[-1,1]){g.beginPath();g.arc(cx+s*0.36*R,cy-0.14*R,0.085*R,0,6.28);g.fill()}
  g.beginPath();g.ellipse(cx,cy+0.16*R,0.14*R,0.1*R,0,0,6.28);g.fill();
  g.strokeStyle='#10241C';g.lineWidth=Math.max(2,0.05*R);g.lineCap='round';g.beginPath();g.arc(cx,cy+0.3*R,0.16*R,0.25,2.9);g.stroke();
}
THEMES.bear=function(t,level,burst,o){
  const cx=o.x??240,cy=(o.y??330)+Math.sin(t*1.3)*7,R0=o.r||92;
  const pop=ease(level/0.08),sup=ease((level-0.34)/0.14),back=ease((level-0.56)/0.1);
  const k=pop*(1-0.55*sup)+back*0.75, BR=R0*1.55*(0.85+0.15*pop);
  g.save();g.shadowColor='rgba(0,0,0,0.3)';g.shadowBlur=26;g.shadowOffsetY=10;
  g.fillStyle='#0F3B2E';g.beginPath();g.arc(cx,cy,BR*pop,0,6.28);g.fill();
  const tx=o.tx??1,ty=o.ty??1;
  g.beginPath();g.arc(cx+tx*BR*0.95,cy+ty*BR*0.95,24*pop,0,6.28);g.fill();g.beginPath();g.arc(cx+tx*BR*1.25,cy+ty*BR*1.3,13*pop,0,6.28);g.fill();g.restore();
  g.strokeStyle='#6CC57E';g.lineWidth=5;g.beginPath();g.arc(cx,cy,BR*pop-9,0,6.28);g.stroke();
  if(k>0.02)bearFace(cx,cy+6,R0*Math.min(k,1.22));
  // qayıdan fikir: kiçik ayılar
  const M=[[-1.75,-0.3,0.42],[1.55,-1.2,0.36],[1.9,0.35,0.3]];
  M.forEach(([dx,dy,s],i)=>{const a=ease((level-0.66-i*0.06)/0.08);if(a>0){const x=cx+dx*R0,y=cy+dy*R0+Math.sin(t*2+i)*6;
    g.save();g.shadowColor='rgba(0,0,0,0.25)';g.shadowBlur=14;g.fillStyle='#0F3B2E';g.beginPath();g.arc(x,y,R0*s*1.5*a,0,6.28);g.fill();g.restore();bearFace(x,y+2,R0*s*a)}});
};
// Vaxt intervalları: fokus (yaşıl) və fasilə (ağ) blokları ardıcıl dolur
THEMES.blocks=function(t,level,burst,o){
  const x=o.x??60,y=(o.y??310)+Math.sin(t*1.2)*5,W_=o.w||560,H_=150,a0=ease(level/0.08);
  g.save();g.globalAlpha*=a0;g.shadowColor='rgba(0,0,0,0.3)';g.shadowBlur=24;g.shadowOffsetY=8;g.fillStyle='#0F3B2E';
  g.beginPath();g.roundRect(x,y,W_,H_,34);g.fill();g.restore();
  // saat
  const cx=x+74,cy=y+H_/2;g.save();g.globalAlpha*=a0;g.strokeStyle='#FFFFFF';g.lineWidth=6;g.beginPath();g.arc(cx,cy,34,0,6.28);g.stroke();
  g.lineCap='round';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy-22);g.moveTo(cx,cy);g.lineTo(cx+Math.cos(t*1.6-1.57)*17,cy+Math.sin(t*1.6-1.57)*17);g.stroke();g.restore();
  const seq=[[3,1],[1,0],[3,1],[1,0],[3,1]],tot=seq.reduce((s,[w])=>s+w,0),x1=x+134,ww=W_-134-30,gap=10;let bx=x1,acc=0;
  for(const [w,foc] of seq){const bw=ww*w/tot-gap,a=ease((level-0.12-acc/tot*0.62)/0.1);acc+=w;
    g.fillStyle='rgba(255,255,255,0.14)';g.beginPath();g.roundRect(bx,y+48,bw,54,14);g.fill();
    if(a>0){g.fillStyle=foc?'#6CC57E':'#FFFFFF';g.beginPath();g.roundRect(bx,y+48,bw*a,54,14);g.fill()}
    bx+=bw+gap}
};

// Kitab rəfi: kitablar bir-bir düşür; pick — bir kitab çıxarılır; far — uzaq, solğun rəf, sonda "?"
function shade(hex,k){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,gg=(n>>8)&255,b=n&255;return `rgb(${Math.round(r*k)},${Math.round(gg*k)},${Math.round(b*k)})`}
THEMES.shelf=function(t,level,burst,o){
  const far=!!o.far,sc=o.s||1,n=o.n||7,r=rng(o.seed||5),bob=Math.sin(t*1.1)*6;
  const x0=(o.x??50),y0=(o.y??820)+bob,Wd=250*sc,dx=44*sc,dy=-28*sc,th=16*sc;
  const fadeFar=far?Math.max(0.3,1-ease((level-0.55)/0.4)*0.7):1;
  g.save();g.globalAlpha*=far?0.8*fadeFar:1;if(far)g.filter=`blur(${(0.5+level*2).toFixed(1)}px)`;
  const COL=['#6CC57E','#FFFFFF','#B5E9CF','#3E9E57','#F4EEE2','#8FD9A5'];
  // rəf lövhəsi
  g.fillStyle='rgba(0,0,0,0.28)';g.beginPath();g.ellipse(x0+Wd/2+dx/2,y0+th+16*sc,Wd*0.62,12*sc,0,0,6.28);g.fill();
  g.fillStyle='#1E6B4A';g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+dx,y0+dy);g.lineTo(x0+Wd+dx,y0+dy);g.lineTo(x0+Wd,y0);g.closePath();g.fill();
  g.fillStyle='#0F3B2E';g.fillRect(x0,y0,Wd,th);
  g.fillStyle='#0A2A20';g.beginPath();g.moveTo(x0+Wd,y0);g.lineTo(x0+Wd+dx,y0+dy);g.lineTo(x0+Wd+dx,y0+dy+th);g.lineTo(x0+Wd,y0+th);g.closePath();g.fill();
  g.strokeStyle='rgba(108,197,126,0.9)';g.lineWidth=2.5*sc;g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+Wd,y0);g.stroke();
  // kitablar
  let bx=x0+12*sc;const bw0=(Wd-24*sc)/n;
  for(let i=0;i<n;i++){
    const bw=bw0*(0.72+r()*0.22),bh=(92+r()*62)*sc,col=COL[Math.floor(r()*COL.length)],a=ease((level-0.04-i/n*0.42)/0.12);
    if(a>0){
      let lift=(1-a)*-70*sc,gl=0;
      if(o.pick===i){const pp=ease((level-0.66)/0.2);lift-=pp*58*sc;gl=pp}
      const X=bx,Y=y0-bh+lift,ddx=dx*0.42,ddy=dy*0.42;
      g.save();g.globalAlpha*=a;
      if(gl>0){g.shadowColor='rgba(181,233,207,0.95)';g.shadowBlur=34*gl}
      g.fillStyle=shade(col,0.62);g.beginPath();g.moveTo(X+bw,Y);g.lineTo(X+bw+ddx,Y+ddy);g.lineTo(X+bw+ddx,Y+ddy+bh);g.lineTo(X+bw,Y+bh);g.closePath();g.fill();
      g.fillStyle=shade(col,0.82);g.beginPath();g.moveTo(X,Y);g.lineTo(X+ddx,Y+ddy);g.lineTo(X+bw+ddx,Y+ddy);g.lineTo(X+bw,Y);g.closePath();g.fill();
      const gr=g.createLinearGradient(X,0,X+bw,0);gr.addColorStop(0,shade(col,1));gr.addColorStop(1,shade(col,0.86));g.fillStyle=gr;g.fillRect(X,Y,bw,bh);
      g.shadowBlur=0;g.fillStyle='rgba(15,59,46,0.55)';g.fillRect(X+bw*0.22,Y+bh*0.16,bw*0.56,3*sc);g.fillRect(X+bw*0.22,Y+bh*0.16+8*sc,bw*0.56,3*sc);
      g.restore();
    }
    bx+=bw0;
  }
  g.restore();
  if(far){const q=ease((level-0.62)/0.2);if(q>0){g.save();g.globalAlpha*=q;g.font=`800 ${Math.round(120*sc)}px Montserrat, MontserratExt, Arial`;g.textAlign='center';
    g.shadowColor='rgba(0,0,0,0.5)';g.shadowBlur=18;g.fillStyle='#FFFFFF';g.fillText('?',x0+Wd/2+dx/2,y0-170*sc+Math.sin(t*2)*8);g.restore()}}
};

function draw(theme,t,level,alpha,burst,opts){g.clearRect(0,0,1080,1920);if(alpha<=0)return;g.save();g.globalAlpha=alpha;const _o=opts||{};if(_o.sc){g.translate(_o.x||0,_o.y||0);g.scale(_o.sc,_o.sc);g.translate(-(_o.x||0),-(_o.y||0))}THEMES[theme](t,level,burst,_o);g.restore()}
window.draw=draw;
</script></body></html>
